apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipv6-flusher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ipv6-flusher

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ipv6-flusher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ipv6-flusher
        app.kubernetes.io/instance: ipv6-flusher
    spec:
      serviceAccountName: ipv6-flusher
      containers:
      - name: ipv6-flusher
        image: ghcr.io/log-z/k3s-ipv6-flusher:v{{ .Chart.Version }}
        imagePullPolicy: IfNotPresent
        env:
          - name: TZ
            value: {{ .Values.timezone }}
        startupProbe:
          failureThreshold: 3
          successThreshold: 1
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 5
          exec:
            command:
            - python
            - health.py
            - startup
        readinessProbe:
          failureThreshold: 3
          successThreshold: 1
          initialDelaySeconds: 15
          timeoutSeconds: 1
          periodSeconds: 10
          exec:
            command:
            - python
            - health.py
            - readiness
        livenessProbe:
          failureThreshold: 3
          successThreshold: 1
          initialDelaySeconds: 30
          timeoutSeconds: 1
          periodSeconds: 60
          exec:
            command:
            - python
            - health.py
            - liveness
